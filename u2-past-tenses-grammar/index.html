<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Past tenses — тренажёр B1+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF1F5; --card:#FFFFFF; --ink:#1F2430; --muted:#5B6272; --line:#D5DAE2; --soft:#F4F6F9;
    --ps:#1E8C8A; --pc:#C0720A; --pp:#3D4FA8; --ppc:#9B3D7A;
    --good:#1E7A3C; --bad:#B3261E;
    --display:"Bricolage Grotesque","Arial Narrow",Arial,sans-serif;
    --body:"PT Sans",Verdana,Arial,sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#14171D; --card:#1E222A; --ink:#E9ECF2; --muted:#A3AAB8; --line:#363C48; --soft:#262B35;
      --ps:#3CC3BF; --pc:#F0A23A; --pp:#8C9BF0; --ppc:#E07AB8; --good:#5BC97D; --bad:#F2776E;
      color-scheme:dark;
    }
  }
  *{box-sizing:border-box}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;
       padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px 40px}
  header h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,7vw,40px);line-height:1;margin:0}
  header p{margin:6px 0 0;color:var(--muted);font-size:16px}

  .tabs{display:flex;gap:8px;margin:20px 0 14px;overflow-x:auto}
  .tab{flex:1 1 0;min-width:0;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;
       padding:10px 12px;font:700 15px var(--body);cursor:pointer;text-align:left}
  @media (max-width:520px){.tab{font-size:13px;padding:8px}}
  .tab small{display:block;font-weight:400;color:var(--muted)}
  .tab[aria-selected="true"]{border-color:var(--ink)}
  .tab.done small{color:var(--good)}

  .panel{background:var(--card);border-radius:16px;padding:20px;border:1px solid var(--line)}
  .task{margin:0 0 4px;font-weight:700}
  .bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin:10px 0 18px}
  .bar i{display:block;height:100%;background:var(--ink);width:0;transition:width .25s}
  .count{font-size:14px;color:var(--muted);float:right}

  .q{font-size:21px;line-height:1.5;margin:6px 0 18px}
  .q mark{background:none;color:var(--ink);font-weight:700;border-bottom:3px solid var(--ink)}
  .q .gap{display:inline-block;min-width:90px;border-bottom:3px dashed var(--muted);color:var(--muted);text-align:center}
  .q .hint{color:var(--muted);font-size:17px}

  .opts{display:grid;gap:10px}
  .opts.four{grid-template-columns:1fr 1fr}
  @media (max-width:520px){.opts.four{grid-template-columns:1fr}}
  .opt{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;
       font:400 18px var(--body);text-align:left;cursor:pointer;display:flex;gap:10px;align-items:baseline}
  .opt b{font-family:var(--display);font-size:20px;line-height:1}
  .opt:hover:not(:disabled){border-color:var(--muted)}
  .opt:disabled{cursor:default}
  .opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--card))}
  .opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
  .t-a{color:var(--pp)} .t-b{color:var(--ps)} .t-c{color:var(--pc)} .t-d{color:var(--ppc)}

  .typed{display:flex;gap:10px;flex-wrap:wrap}
  .typed input{flex:1 1 220px;font:400 20px var(--body);padding:12px 14px;border-radius:12px;border:2px solid var(--line);
               background:var(--card);color:var(--ink)}
  .typed input.right{border-color:var(--good)} .typed input.wrong{border-color:var(--bad)}

  .btn{border:0;border-radius:12px;padding:13px 20px;font:700 17px var(--body);cursor:pointer;background:var(--ink);color:var(--card)}
  .btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
  .btn:disabled{opacity:.4;cursor:default}
  :focus-visible{outline:3px solid var(--pp);outline-offset:2px}

  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;background:var(--soft);border-left:5px solid var(--good);display:none}
  .fb.show{display:block}
  .fb.no{border-left-color:var(--bad)}
  .fb strong{display:block;margin-bottom:4px}
  .fb .tense{font-weight:700}
  .next{margin-top:16px;display:none}
  .next.show{display:inline-block}

  .result{text-align:center;padding:10px 0}
  .pct{font-family:var(--display);font-weight:800;font-size:64px;line-height:1;margin:10px 0 4px}
  .verdict{display:inline-block;padding:8px 14px;border-radius:999px;font-weight:700;color:#fff;margin:8px 0 16px}
  .rows{text-align:left;margin:16px auto;max-width:420px}
  .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
  .result .btn{margin:6px}
  @media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Past tenses</h1>
    <p>Тренажёр B1+: past simple, past continuous, past perfect simple, past perfect continuous</p>
  </header>

  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main class="panel" id="panel" aria-live="polite"></main>
</div>

<script>
const T = {
  a:{name:"past perfect simple", cls:"t-a"},
  b:{name:"past simple", cls:"t-b"},
  c:{name:"past continuous", cls:"t-c"},
  d:{name:"past perfect continuous", cls:"t-d"}
};

/* 1. Какое время? */
const EX1 = [
  {s:"I <mark>had been studying</mark> for three hours, so I was really tired.", k:"d", e:"Долгий процесс до момента в прошлом + причина усталости."},
  {s:"When we arrived, the party <mark>had</mark> already <mark>finished</mark>.", k:"a", e:"Вечеринка закончилась раньше, чем мы пришли."},
  {s:"She <mark>was cooking</mark> dinner when the lights went out.", k:"c", e:"Процесс, который прервало короткое событие."},
  {s:"We <mark>moved</mark> to Kazan in 2019.", k:"b", e:"Законченное действие в известное время (in 2019)."},
  {s:"Jack <mark>had never flown</mark> before his trip to Spain.", k:"a", e:"Опыт до определённого момента в прошлом (before his trip)."},
  {s:"While I <mark>was walking</mark> the dog, it started to snow.", k:"c", e:"Фон истории: действие в процессе (while)."},
  {s:"They <mark>finished</mark> the project and <mark>went</mark> home.", k:"b", e:"Цепочка событий одно за другим."},
  {s:"Her eyes were red because she <mark>had been crying</mark>.", k:"d", e:"Длительный процесс объясняет видимый результат в прошлом."},
  {s:"At 7 pm yesterday we <mark>were watching</mark> a film.", k:"c", e:"Действие в процессе в конкретный момент прошлого."},
  {s:"The ground was wet. It <mark>had been raining</mark> all night.", k:"d", e:"Длительность (all night) + причина: земля мокрая."},
  {s:"By the time the teacher came, I <mark>had done</mark> all the exercises.", k:"a", e:"By the time: к этому моменту всё уже сделано, важен результат."},
  {s:"Yesterday I <mark>lost</mark> my keys.", k:"b", e:"Простой факт в прошлом (yesterday)."}
];

/* 2. Выбери форму */
const EX2 = [
  {s:"I ___ a book when the phone rang.", o:["read","was reading","had read","have read"], r:1, k:"c", e:"Чтение было в процессе, звонок его прервал."},
  {s:"When I got to the station, my train ___ ten minutes before.", o:["left","was leaving","had left","has left"], r:2, k:"a", e:"Поезд ушёл раньше, чем я пришёл на вокзал."},
  {s:"I ___ for forty minutes when the bus finally came.", o:["waited","was waiting","had been waiting","have been waiting"], r:2, k:"d", e:"Как долго (for forty minutes) длилось до момента, когда пришёл автобус."},
  {s:"Last Saturday we got up early, ___ breakfast and went to the park.", o:["had","were having","had had","had been having"], r:0, k:"b", e:"Цепочка событий по порядку: got up → had → went."},
  {s:"At 8 o'clock last night I ___ a shower, so I didn't hear your call.", o:["have","was having","had had","have had"], r:1, k:"c", e:"В 8 часов я был в процессе, поэтому не услышал звонок."},
  {s:"Tom wasn't hungry because he ___ lunch.", o:["was already eating","had already eaten","has already eaten","had already been eating"], r:1, k:"a", e:"Обед уже закончился к тому моменту — важен результат: он сыт."},
  {s:"The streets were wet because it ___ all night.", o:["has been raining","was raining","had been raining","rains"], r:2, k:"d", e:"Длительность (all night) до момента в прошлом + причина мокрых улиц."},
  {s:"She ___ snow before she moved to Moscow.", o:["never saw","was never seeing","had never seen","has never seen"], r:2, k:"a", e:"Опыт до момента в прошлом (before she moved)."},
  {s:"While the children ___ in the garden, it started to rain.", o:["played","were playing","had played","have played"], r:1, k:"c", e:"While + процесс; дождь начался посреди игры."},
  {s:"In 2019 my family ___ to a new flat.", o:["moved","was moving","had moved","had been moving"], r:0, k:"b", e:"Законченное действие в известное время (in 2019)."}
];

/* 3. Впиши глагол */
const EX3 = [
  {s:"When I arrived, everyone ___ <span class='hint'>(leave)</span>.", a:["had left"], k:"a", e:"Все ушли до того, как я пришёл."},
  {s:"We ___ <span class='hint'>(watch)</span> TV when we heard a strange noise.", a:["were watching"], k:"c", e:"Процесс, который прервал шум."},
  {s:"He was out of breath because he ___ <span class='hint'>(run)</span>.", a:["had been running"], k:"d", e:"Процесс до момента в прошлом объясняет результат: запыхался."},
  {s:"I ___ <span class='hint'>(not / sleep)</span> well last night.", a:["did not sleep"], k:"b", e:"Факт в прошлом; отрицание: didn't + V."},
  {s:"___ <span class='hint'>(you / finish)</span> your homework before the lesson started?", a:["had you finished"], k:"a", e:"Вопрос о том, что было сделано ДО начала урока: Had + подлежащее + V3."},
  {s:"What ___ <span class='hint'>(you / do)</span> at 9 pm yesterday?", a:["were you doing"], k:"c", e:"Процесс в конкретный момент: Were + подлежащее + V-ing."},
  {s:"She ___ <span class='hint'>(teach)</span> for twenty years when she retired.", a:["had been teaching"], k:"d", e:"Как долго длилось до момента в прошлом (for twenty years)."},
  {s:"They ___ <span class='hint'>(buy)</span> a new car last month.", a:["bought"], k:"b", e:"Факт в прошлом (last month); buy — неправильный глагол: bought."}
];

const SETS = [
  {id:"ex1", title:"1. Какое время?", task:"Какое время у выделенного глагола?", items:EX1, type:"tense"},
  {id:"ex2", title:"2. Выбери форму", task:"Выбери правильную форму глагола.", items:EX2, type:"choice"},
  {id:"ex3", title:"3. Впиши глагол", task:"Впиши глагол в нужном времени. Сокращения (didn't, hadn't) тоже засчитываются.", items:EX3, type:"typed"}
];

/* шкала-светофор */
function verdict(p){
  if(p>=90) return ["Очень уверенно","#0F6B32"];
  if(p>=80) return ["Уверенно","#2E9E4F"];
  if(p>=70) return ["Хороший результат","#7CBF4A"];
  if(p>=60) return ["Двигаемся вперёд, но есть моменты для обсуждения","#D9A400"];
  return ["Нужно срочно подтянуть","#C62828"];
}

const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const norm = s => s.toLowerCase().replace(/[’`]/g,"'").replace(/[.?!,]/g,"")
  .replace(/\bwasn't\b/g,"was not").replace(/\bweren't\b/g,"were not").replace(/\bhadn't\b/g,"had not")
  .replace(/\bdidn't\b/g,"did not").replace(/\s+/g," ").trim();

let state = {};
function reset(id){ const set=SETS.find(s=>s.id===id); state[id]={order:shuffle(set.items.map((_,i)=>i)), i:0, score:0, done:false}; }
SETS.forEach(s=>reset(s.id));
let current = "ex1";

const tabs = document.getElementById("tabs"), panel = document.getElementById("panel");

function drawTabs(){
  tabs.innerHTML = "";
  SETS.forEach(s=>{
    const st=state[s.id], b=document.createElement("button");
    b.className="tab"+(st.done?" done":""); b.setAttribute("role","tab"); b.setAttribute("aria-selected",s.id===current);
    b.innerHTML = s.title + `<small>${st.done ? st.score+" из "+s.items.length : s.items.length+" заданий"}</small>`;
    b.onclick=()=>{current=s.id; draw();};
    tabs.appendChild(b);
  });
}

function tenseLine(k){ return `<span class="tense ${T[k].cls}">${k} — ${T[k].name}</span>`; }

function draw(){
  drawTabs();
  const set=SETS.find(s=>s.id===current), st=state[current];
  if(st.done) return drawResult(set, st);
  const item=set.items[st.order[st.i]], n=set.items.length;
  let html = `<p class="task">${set.task}<span class="count">${st.i+1} / ${n}</span></p>
    <div class="bar"><i style="width:${st.i/n*100}%"></i></div>`;
  const q = set.type==="tense" ? item.s : item.s.replace("___","<span class='gap'>?</span>");
  html += `<p class="q">${q}</p>`;

  if(set.type==="tense"){
    html += `<div class="opts four">` + ["a","b","c","d"].map(k=>
      `<button class="opt" data-k="${k}"><b class="${T[k].cls}">${k}</b>${T[k].name}</button>`).join("") + `</div>`;
  } else if(set.type==="choice"){
    const idx = shuffle(item.o.map((_,i)=>i));
    html += `<div class="opts four">` + idx.map(i=>`<button class="opt" data-i="${i}">${item.o[i]}</button>`).join("") + `</div>`;
  } else {
    html += `<div class="typed"><input id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Ответ">
      <button class="btn" id="check">Проверить</button></div>`;
  }
  html += `<div class="fb" id="fb"></div><button class="btn next" id="next">${st.i+1<n?"Дальше":"Посмотреть результат"}</button>`;
  panel.innerHTML = html;

  const fb=document.getElementById("fb"), next=document.getElementById("next");
  const finish = ok => {
    if(ok) st.score++;
    fb.className = "fb show"+(ok?"":" no");
    const right = (ok || set.type==="tense") ? "" :
      set.type==="choice" ? ` Правильно: <b>${item.o[item.r]}</b>.` : ` Правильно: <b>${item.a[0]}</b>.`;
    fb.innerHTML = `<strong>${ok?"Верно!":"Не совсем."}${right}</strong>${tenseLine(item.k)}. ${item.e}`;
    next.classList.add("show"); next.focus();
  };
  next.onclick = ()=>{ st.i++; if(st.i>=n) st.done=true; draw(); };

  if(set.type==="tense" || set.type==="choice"){
    panel.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const ok = set.type==="tense" ? b.dataset.k===item.k : +b.dataset.i===item.r;
      panel.querySelectorAll(".opt").forEach(x=>{
        x.disabled=true;
        const isRight = set.type==="tense" ? x.dataset.k===item.k : +x.dataset.i===item.r;
        if(isRight) x.classList.add("right");
      });
      if(!ok) b.classList.add("wrong");
      finish(ok);
    });
  } else {
    const inp=document.getElementById("inp"), chk=document.getElementById("check");
    inp.focus();
    const go=()=>{
      if(!inp.value.trim()) return;
      const ok=item.a.some(a=>norm(a)===norm(inp.value));
      inp.classList.add(ok?"right":"wrong"); inp.disabled=true; chk.disabled=true;
      finish(ok);
    };
    chk.onclick=go;
    inp.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); go(); } };
  }
}

function drawResult(set, st){
  const n=set.items.length, p=Math.round(st.score/n*100), [v,c]=verdict(p);
  const all = SETS.every(s=>state[s.id].done);
  let html = `<div class="result"><p class="task">${set.title}</p>
    <div class="pct" style="color:${c}">${p}%</div><div>${st.score} из ${n}</div>
    <div class="verdict" style="background:${c}">${v}</div>`;
  if(all){
    const tot=SETS.reduce((a,s)=>a+state[s.id].score,0), max=SETS.reduce((a,s)=>a+s.items.length,0);
    const tp=Math.round(tot/max*100), [tv,tc]=verdict(tp);
    html += `<div class="rows">` + SETS.map(s=>`<div class="row"><span>${s.title}</span><b>${state[s.id].score} из ${s.items.length}</b></div>`).join("")
      + `<div class="row"><span><b>Итого</b></span><b>${tot} из ${max} (${tp}%)</b></div></div>
      <div class="verdict" style="background:${tc}">${tv}</div><br>`;
  }
  html += `<button class="btn ghost" id="again">Пройти заново</button>`;
  const nextSet = SETS.find(s=>!state[s.id].done);
  if(nextSet) html += `<button class="btn" id="go">${nextSet.title}</button>`;
  html += `</div>`;
  panel.innerHTML = html;
  document.getElementById("again").onclick=()=>{ reset(set.id); draw(); };
  if(nextSet) document.getElementById("go").onclick=()=>{ current=nextSet.id; draw(); };
}

draw();
</script>
</body>
</html>
